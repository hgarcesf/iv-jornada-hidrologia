            # Open Graph / X (Twitter) Cards
            description: |
                IV Jornada de Hidrología
            themes:
                event:
                    slogan: "Del dato a la decisión: Hidrología para Chile"
                    location: Santiago
                    description: |
                        Las **Jornada de Hidrología en Chile** son un encuentro anual orientado a fortalecer el vínculo entre la investigación científica, la práctica profesional y la gestión pública del agua. Este espacio busca reunir a **investigadores**, **profesionales** del sector público y privado, y **estudiantes** interesados en los desafíos actuales y futuros de la hidrología en el país. Es una oportunidad para revisar el estado del arte, identificar brechas de conocimiento y promover estrategias que deriven de la evidencia científica para la gestión sostenible de los recursos hídricos.


                        La IV Jornada de Hidrología será un espacio donde hidrólogas e hidrólogos, en diferentes etapas de su carrera, podrán intercambiar experiencias y enterarse de avances recientes en temas como:
                        - Procesos hidrometeorológicos: dinámica superficie–atmósfera en montaña, valle y costa
                        - Pronóstico hidrometeorológico: métodos, desempeño e incertidumbre
                        - Eco-hidrología y gestión ambiental: ecosistemas, calidad y caudales ecológicos
                        - Proyecciones hidroclimáticas: escenarios futuros e impactos del cambio climático en los recursos hídricos
                        - Tecnología, datos y aplicaciones operacionales en hidrología
                        - Sociohidrología: gobernanza, participación y decisiones sobre el agua

                    locationDescription: |
                        La **Facultad de Ciencias Físicas y Matemáticas (FCFM)** de la Universidad de Chile —conocida popularmente como **Beauchef**— es uno de los centros de educación superior, investigación y desarrollo tecnológico más importantes del país.

                        Fundada en 1842, imparte carreras de pregrado y programas de postgrado en áreas como ingeniería, ciencias de la computación, astronomía, física, geofísica y geología.

                        - **Dirección principal**: Av. Beauchef 850 / 851, Santiago, Región Metropolitana (Campus Beauchef).
                        - **Metro más cercano**: Estaciones Parque O'Higgins y Toesca (Línea 2), a pocos minutos caminando.

                    auxDescription: |
                        Es un agrado comunicarles que recibimos cerca de **60 trabajos** y aproximadamente **100 inscritos** en total.

                        Dentro de la **semana del 15 al 19 de Diciembre** esperamos enviar los correos confirmando la **aceptación de los trabajos**, sugerencias de mejora, la sesión en la que finalmente quedó aceptado, y la modalidad en que será presentado  el trabajo (presentación oral o póster).

                        **¡Esperamos vernos en Enero!**
                    auxTitle: Actualización
                    auxSlogan: Estado de la convocatoria
                    nSessions: 6
                    nDays: 3
                    locationAux: Santiago de Chile
